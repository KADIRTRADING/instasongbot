[project]
name = "instasongbot"
version = "1.0.0"
description = "Telegram bot for music recognition, social media downloads, and video-to-audio conversion."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that call a real external API (skipped by default, run with -m live)",
]
addopts = "-m \"not live\""

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
